services:
  - type: web
    name: asr-labeling-backend
    runtime: python
    plan: free
    rootDir: src/labeling_app/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: asr-labeling-db
          property: connectionString
      - key: AUDIO_ACCESS_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

databases:
  - name: asr-labeling-db
    plan: free
